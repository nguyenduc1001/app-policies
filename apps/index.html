<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our apps</title>
<meta name="description" content="iOS and Android apps by DUC NGUYEN: HomeTaste Japan, Nearly-Đ, Renewly-Đ.">
<style>
  :root { --text: #0f172a; --muted: #64748b; --accent: #4f46e5; --bg: #ffffff; --card: #f8fafc; --line: #e2e8f0; --qr-bg: #ffffff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --text: #e2e8f0; --muted: #94a3b8; --accent: #a5b4fc; --bg: #0f172a; --card: #1e293b; --line: #334155; --qr-bg: #e2e8f0; } }
  :root[data-theme="dark"] { --text: #e2e8f0; --muted: #94a3b8; --accent: #a5b4fc; --bg: #0f172a; --card: #1e293b; --line: #334155; --qr-bg: #e2e8f0; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.7 -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
  body.embed main { padding: 0 0 8px; max-width: none; }
  body.embed h1, body.embed .meta { display: none; }
  body.embed .app:first-child { margin-top: 0; }
  h1 { font-size: 26px; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  /* Mỗi app: không nền, chỉ kẻ viền trên và dưới (không viền trái phải, không bo góc) */
  .app { background: none; border: 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); border-radius: 0; padding: 18px 16px; margin: 14px 0; }
  .head { display: flex; align-items: center; gap: 14px; }
  .head img { width: 64px; height: 64px; border-radius: 15px; border: 1px solid var(--line); }
  .head h2 { font-size: 19px; margin: 0; line-height: 1.3; }
  .tagline { color: var(--muted); font-size: 14px; margin: 2px 0 0; line-height: 1.5; }
  /* Mỗi cửa hàng là một hàng: QR bên trái, tên + nút chép link bên phải (hợp màn hình dọc điện thoại) */
  .stores { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 14px; }
  @media (min-width: 560px) { .stores { grid-template-columns: 1fr 1fr; } }
  .store { display: flex; align-items: center; gap: 14px; border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--bg); }
  .store.soon { opacity: .5; }
  .store a.qr { display: block; flex: 0 0 auto; line-height: 0; }
  .store img.qr { width: 84px; height: 84px; border-radius: 8px; background: var(--qr-bg); padding: 4px; box-sizing: border-box; }
  .store .body { min-width: 0; flex: 1; }
  .store .name { display: block; font-size: 14px; font-weight: 700; color: var(--text); text-decoration: none; }
  .store .soonTag { display: block; font-size: 11px; color: var(--muted); }
  .copy { margin-top: 7px; font: inherit; font-size: 12px; font-weight: 600; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
  .copy:active { opacity: .6; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .actions .copy { margin-top: 0; }
</style>
</head>
<body>
<main>
<h1 id="t-title">Our apps</h1>
<p class="meta">iOS · Android · <a href="mailto:nguyenduc1001@gmail.com">nguyenduc1001@gmail.com</a></p>
<div id="list"></div>
</main>
<script>
(function () {
  var qs = new URLSearchParams(location.search);
  if (qs.get("embed") === "1") document.body.classList.add("embed");
  var theme = qs.get("theme");
  if (theme === "dark" || theme === "light") document.documentElement.setAttribute("data-theme", theme);
  var lang = qs.get("lang") || (navigator.language || "en").slice(0, 2);
  if (["vi", "en", "ja"].indexOf(lang) < 0) lang = "en";
  document.documentElement.lang = lang;

  var UI = {
    title: { vi: "Ứng dụng của chúng tôi", en: "Our apps", ja: "アプリ一覧" },
    copy: { vi: "Chép link", en: "Copy link", ja: "リンクをコピー" },
    copied: { vi: "Đã chép ✓", en: "Copied ✓", ja: "コピー済み ✓" },
    share: { vi: "Chia sẻ", en: "Share", ja: "シェア" },
    soon: { vi: "Sắp có", en: "Coming soon", ja: "近日公開" },
    web: { vi: "Trang web", en: "Website", ja: "ウェブサイト" },
  };
  var APPS = [
    {
      id: "hometaste", icon: "img/hometaste.png", name: "HomeTaste Japan",
      tagline: {
        vi: "Rau quê nhà và món Á tại Nhật: rau củ, công thức, cửa hàng gần bạn.",
        en: "Asian home cooking in Japan: vegetables, recipes and stores near you.",
        ja: "日本でアジアの家庭料理を。野菜・レシピ・近くのお店探し。",
      },
      stores: [
        { key: "ios", name: "App Store", qr: "qr/ht-ios.svg", url: "https://apps.apple.com/app/id6832458510" },
        { key: "play", name: "Google Play", qr: "qr/ht-play.svg", url: "https://play.google.com/store/apps/details?id=com.hometaste.japan", soon: true },
        { key: "web", name: UI.web[lang], qr: "qr/ht-web.svg", url: "https://hometastejapan.com" },
      ],
    },
    {
      id: "nearly", icon: "img/nearly.png", name: "Nearly-Đ",
      tagline: {
        vi: "Chia sẻ vị trí với gia đình và bạn bè, hai bên cùng đồng ý.",
        en: "Share your location with family and friends, with consent on both sides.",
        ja: "家族や友人と、お互いの同意のもとで位置情報をシェア。",
      },
      stores: [
        { key: "ios", name: "App Store", qr: "qr/ne-ios.svg", url: "https://apps.apple.com/app/id6829638846" },
        { key: "play", name: "Google Play", qr: "qr/ne-play.svg", url: "https://play.google.com/store/apps/details?id=com.nearly.app" },
      ],
    },
    {
      id: "phr", icon: "img/phr.png", name: "お薬手帳 PHR",
      tagline: {
        vi: "Sổ tay thuốc cá nhân: quản lý đơn thuốc, lịch uống thuốc và sức khỏe.",
        en: "Personal medication notebook: prescriptions, dose schedule and health records.",
        ja: "お薬手帳アプリ。処方・服用スケジュール・健康記録をひとつに。",
      },
      stores: [
        { key: "play", name: "Google Play", qr: "qr/ph-play.svg", url: "https://play.google.com/store/apps/details?id=jp.phr.okusuri" },
      ],
    },
    {
      id: "renewly", icon: "img/renewly.png", name: "Renewly-Đ",
      tagline: {
        vi: "Nhắc hạn visa, thẻ cư trú, bằng lái, shaken và các việc định kỳ tại Nhật.",
        en: "Reminders for visa, residence card, licence and other renewal deadlines in Japan.",
        ja: "在留カード・免許・車検など、日本での更新期限をリマインド。",
      },
      stores: [
        { key: "ios", name: "App Store", qr: "qr/re-ios.svg", url: "https://apps.apple.com/app/id6827803688" },
        { key: "play", name: "Google Play", qr: "qr/re-play.svg", url: "https://play.google.com/store/apps/details?id=com.renewly.app" },
      ],
    },
  ];

  document.title = UI.title[lang];
  document.getElementById("t-title").textContent = UI.title[lang];

  function copyText(text, btn) {
    var done = function () {
      btn.textContent = UI.copied[lang];
      setTimeout(function () { btn.textContent = UI.copy[lang]; }, 1600);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { fallback(); });
    } else fallback();
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
      document.body.removeChild(ta);
    }
  }

  // Khi nhúng, bấm link phải mở App Store / Play Store (hoặc trình duyệt hệ thống),
  // không điều hướng bên trong khung nhúng: chuyển URL về app chủ xử lý.
  var embedded = qs.get("embed") === "1";
  function openStore(url) {
    if (window.ReactNativeWebView) { window.ReactNativeWebView.postMessage(JSON.stringify({ openUrl: url })); return; }
    if (window.parent !== window) { window.parent.postMessage({ hometasteOpen: url }, "*"); return; }
    window.open(url, "_blank", "noopener");
  }
  function wireOpen(el, url) {
    if (!embedded) return;
    el.addEventListener("click", function (e) { e.preventDefault(); openStore(url); });
  }

  // Chia sẻ với bạn bè: trong app nhờ app chủ mở bảng chia sẻ gốc; trình duyệt dùng Web Share; không có thì chép link
  function shareLink(text, url, btn) {
    var message = text + "\n" + url;
    if (embedded && window.ReactNativeWebView) { window.ReactNativeWebView.postMessage(JSON.stringify({ shareText: message })); return; }
    if (embedded && window.parent !== window) { window.parent.postMessage({ hometasteShare: message }, "*"); return; }
    if (navigator.share) { navigator.share({ text: text, url: url }).catch(function () {}); return; }
    copyText(message, btn);
  }

  // ?hide=<id>: trang nhúng trong app nào thì giấu chính app đó đi
  var hide = (qs.get("hide") || "").split(",");
  var list = document.getElementById("list");
  APPS.filter(function (app) { return hide.indexOf(app.id) < 0; }).forEach(function (app) {
    var card = document.createElement("section");
    card.className = "app";
    var head = document.createElement("div");
    head.className = "head";
    head.innerHTML = '<img src="' + app.icon + '" alt="" width="64" height="64">' +
      '<div><h2>' + app.name + '</h2><p class="tagline">' + app.tagline[lang] + "</p></div>";
    card.appendChild(head);
    var stores = document.createElement("div");
    stores.className = "stores";
    app.stores.forEach(function (st) {
      var box = document.createElement("div");
      box.className = "store" + (st.soon ? " soon" : "");
      var a = document.createElement("a");
      a.className = "qr"; a.href = st.url; a.target = "_blank"; a.rel = "noreferrer";
      a.innerHTML = '<img class="qr" src="' + st.qr + '" alt="QR: ' + st.name + '" loading="lazy">';
      wireOpen(a, st.url);
      var body = document.createElement("div");
      body.className = "body";
      var nm = document.createElement("a");
      nm.className = "name"; nm.href = st.url; nm.target = "_blank"; nm.rel = "noreferrer";
      nm.textContent = st.name;
      wireOpen(nm, st.url);
      body.appendChild(nm);
      if (st.soon) {
        var tag = document.createElement("span");
        tag.className = "soonTag"; tag.textContent = UI.soon[lang];
        body.appendChild(tag);
      }
      var actions = document.createElement("div");
      actions.className = "actions";
      var btn = document.createElement("button");
      btn.className = "copy"; btn.type = "button"; btn.textContent = UI.copy[lang];
      btn.addEventListener("click", function () { copyText(st.url, btn); });
      var sh = document.createElement("button");
      sh.className = "copy"; sh.type = "button"; sh.textContent = UI.share[lang];
      sh.addEventListener("click", function () { shareLink(app.name + " — " + app.tagline[lang], st.url, sh); });
      actions.appendChild(sh); actions.appendChild(btn);
      body.appendChild(actions);
      box.appendChild(a); box.appendChild(body);
      stores.appendChild(box);
    });
    card.appendChild(stores);
    list.appendChild(card);
  });

  // Nhúng: báo chiều cao cho trang mẹ (iframe) hoặc app native (React Native WebView) để khung tự co giãn
  if (qs.get("embed") === "1") {
    var sendH = function () {
      var h = document.body.scrollHeight;
      if (window.parent !== window) window.parent.postMessage({ hometasteApps: h }, "*");
      if (window.ReactNativeWebView) window.ReactNativeWebView.postMessage(JSON.stringify({ hometasteApps: h }));
    };
    sendH();
    setTimeout(sendH, 300);
    window.addEventListener("load", sendH);
    window.addEventListener("resize", sendH);
  }
})();
</script>
</body>
</html>
